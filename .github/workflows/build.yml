name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build normal + debug
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace
      - name: Stage APKs
        run: |
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "SMS-Link-r${{ github.run_number }}.apk"
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" "SMS-Link-r${{ github.run_number }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SMS-Link-r${{ github.run_number }}
          path: SMS-Link-r${{ github.run_number }}*.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "r${{ github.run_number }}" SMS-Link-r${{ github.run_number }}*.apk \
            --target "$GITHUB_SHA" --title "SMS Link r${{ github.run_number }}" \
            --notes "Normal and Debug builds. Debug logs verbosely and writes a log file on the phone."
